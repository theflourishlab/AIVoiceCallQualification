[project]
name = "becca"
version = "0.1.0"
description = "Becca — AI Voice Call Qualification"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "httpx>=0.28",
    "tenacity>=9.0",
    "pynacl>=1.5",
    "pydantic-settings>=2.7",
    "tzdata>=2026.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "authlib>=1.4",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "sentry-sdk>=2.20",
    "anthropic>=0.40",
    "phonenumbers>=8.13",
    "openpyxl>=3.1",
    "fpdf2>=2.8.8",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["uv_build>=0.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "becca"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py314"
# The docs are references with embedded snippets; never reformat them.
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = [
    "S101", # asserts are fine outside the dial path
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]
# The scorecard page template: one Python string of HTML/CSS/JS, where
# wrapping would mean concatenation noise, not readability.
"becca/evals/html.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["becca"]

[[tool.mypy.overrides]]
module = "authlib.*"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
