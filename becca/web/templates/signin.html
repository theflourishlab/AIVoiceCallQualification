<!doctype html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="utf-8">
  <title>Sign in — Becca</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/becca.css">
</head>
<body>
  <div class="signin" style="min-height:100vh; display:grid; place-items:center">
    <div class="panel" style="max-width:26rem; padding:2.5rem; text-align:center">
      <p class="brand" style="justify-content:center"><span class="dot" aria-hidden="true"></span> Becca</p>
      <h1 class="h3" style="margin:1rem 0 0.5rem">Calls that qualify themselves.</h1>
      <p style="color:var(--bc-text-2); font-size:0.9375rem">
        Describe the call you want made. Becca writes it, dials it, and hands
        you back the answers.
      </p>
      <a class="btn btn-primary" style="margin-top:1.5rem; width:100%" href="/auth/login">
        Continue with Google
      </a>
      <p class="meta-sm" style="margin-top:1.25rem">ACCESS IS GRANTED BY INVITATION</p>
    </div>
  </div>
</body>
</html>
